syntax = "proto3";

package NetGameRunning;

message PlayerInputData {
  float joyX = 1;
  float joyY = 2;
  float camX = 3;
  float camY = 4;
  int32 playerID = 5;
  int32 curFrameIndex = 6;
  int32 nextFrameIndex = 7;
}

message UpdateMessageData {
  int32 curFrameIndex = 1;
  int32 nextFrameIndex = 2;
  repeated PlayerInputData playerInputs = 3;
  float delta = 4;
}

message ReqJoinRoom {
  int32 skinID = 1;
}


message PlayerLeaveData{
  int32 playerID = 1;
}

message ResJoinRoom {
  int32 selfID = 1;
  repeated PlayerData team = 2; 
}

message PlayerData{
  int32 playerID = 1;
  int32 skinID = 2;
}

message SyncRoomPlayersData {
  repeated PlayerData team = 1;
}
